        <style>
        :root {
            --amana-dark: #287067;
            --amana-dark2: #1e544d;
            --amana-mid: #36a07b;
            --amana-light: #63c54b;
            --amana-gray: #8a8c8d;
            --amana-bg: #f4f8f7;
            --topnav-h: 60px;
            --sidebar-w: 320px;
        }
        html, body {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, 'Cairo', Arial, sans-serif;
            overflow: hidden;
        }
        #map {
            position: absolute;
            top: var(--topnav-h);
            left: 0;
            right: var(--sidebar-w);
            bottom: 0;
            width: auto;
            height: auto;
            transition: right .25s ease;
        }

        /* ===== Top Navbar ===== */
        #topnavbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: var(--topnav-h);
            z-index: 1200;
            background: linear-gradient(90deg, var(--amana-dark2), var(--amana-dark) 55%, var(--amana-mid));
            display: flex;
            align-items: center;
            justify-content: space-between;
            direction: rtl;
            padding: 0 18px;
            box-shadow: 0 2px 10px rgba(0,0,0,.18);
            box-sizing: border-box;
        }
        #topnavbar .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }
        #topnavbar .navbar-logo {
            height: 42px;
            width: auto;
            background: #fff;
            border-radius: 8px;
            padding: 3px 6px;
            box-shadow: 0 1px 4px rgba(0,0,0,.2);
            flex-shrink: 0;
        }
        #topnavbar .navbar-titles {
            color: #fff;
            line-height: 1.25;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #topnavbar .navbar-titles h1 {
            margin: 0;
            font-size: 17px;
            font-weight: 700;
        }
        #topnavbar .navbar-titles span {
            font-size: 12px;
            opacity: .88;
        }
        #topnavbar .navbar-toggle {
            display: none;
            background: rgba(255,255,255,.18);
            border: none;
            color: #fff;
            font-size: 18px;
            width: 38px;
            height: 38px;
            border-radius: 8px;
            cursor: pointer;
            flex-shrink: 0;
        }
        #topnavbar .navbar-toggle:hover { background: rgba(255,255,255,.3); }

        /* ===== Navbar actions (print button, etc.) ===== */
        #topnavbar .navbar-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .navbar-print-btn {
            display: flex;
            align-items: center;
            gap: 7px;
            background: rgba(255,255,255,.18);
            border: none;
            color: #fff;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            padding: 0 14px;
            height: 38px;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
        }
        .navbar-print-btn:hover { background: rgba(255,255,255,.3); }
        .navbar-print-btn i { font-size: 15px; }
        @media (max-width: 820px) {
            .navbar-print-btn .print-btn-text { display: none; }
            .navbar-print-btn { width: 38px; padding: 0; justify-content: center; }
        }

        /* ===== Print report header (visible only when printing) ===== */
        #printReportHeader { display: none; }

        /* ===== Right Sidebar ===== */
        #rightsidebar {
            position: fixed;
            top: var(--topnav-h);
            right: 0; bottom: 0;
            width: var(--sidebar-w);
            background: var(--amana-bg);
            border-right: none;
            box-shadow: -2px 0 10px rgba(0,0,0,.08);
            overflow-y: auto;
            z-index: 1100;
            direction: rtl;
            transition: transform .25s ease;
            box-sizing: border-box;
        }
        #rightsidebar::-webkit-scrollbar { width: 8px; }
        #rightsidebar::-webkit-scrollbar-thumb { background: #c2d3cf; border-radius: 4px; }

        .sb-card {
            background: #fff;
            margin: 12px;
            border-radius: 10px;
            box-shadow: 0 1px 5px rgba(0,0,0,.09);
            overflow: hidden;
        }
        .sb-card-header {
            background: var(--amana-dark);
            color: #fff;
            padding: 10px 14px;
            font-weight: 700;
            font-size: 13.5px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
        }
        .sb-card-header .sb-title { display: flex; align-items: center; gap: 8px; }
        .sb-card-header i.sb-caret { transition: transform .2s ease; font-size: 12px; }
        .sb-card.collapsed .sb-card-header i.sb-caret { transform: rotate(90deg); }
        .sb-card-body {
            padding: 12px 14px;
            font-size: 13px;
            color: #2b2b2b;
        }
        #sidebar-stats { direction: ltr; text-align: left; }
        #sidebar-stats-card .sb-card-header { direction: ltr; }
        .sb-card.collapsed .sb-card-body { display: none; }

        /* Stats */
        .sb-stat-row { margin-bottom: 9px; cursor: pointer; border-radius: 6px; padding: 4px 6px; margin-right: -6px; margin-left: -6px; }
        .sb-stat-row:hover { background: var(--amana-bg); }
        .sb-stat-row.active { background: #e4f2ee; }
        .sb-stat-row .sb-stat-label {
            display: flex;
            justify-content: space-between;
            font-size: 12.5px;
            margin-bottom: 3px;
            color: #3a3a3a;
        }
        .sb-stat-bar {
            height: 7px;
            border-radius: 4px;
            background: #e6ece9;
            overflow: hidden;
        }
        .sb-stat-bar > span {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, var(--amana-mid), var(--amana-light));
            border-radius: 4px;
        }

        .sb-stat-reset {
            display: inline-block;
            font-size: 11.5px;
            color: var(--amana-mid);
            cursor: pointer;
            margin-bottom: 8px;
        }
        .sb-stat-reset:hover { text-decoration: underline; }
        .sb-color-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
            border: 1px solid rgba(0,0,0,.15);
        }
        .sb-stat-metrics {
            display: flex;
            gap: 10px;
            margin: 4px 0 6px;
        }
        .sb-stat-metrics .sb-metric {
            flex: 1;
            background: var(--amana-bg);
            border-radius: 8px;
            text-align: center;
            padding: 6px 4px;
        }
        .sb-stat-metrics .sb-metric b {
            display: block;
            font-size: 17px;
            font-weight: 800;
            color: var(--amana-dark2);
            line-height: 1.2;
        }
        .sb-stat-metrics .sb-metric span {
            font-size: 10.5px;
            color: var(--amana-gray);
        }
        .sb-stat-row.active .sb-stat-metrics .sb-metric { background: #d9efe8; }
        .sb-stat-row.active .sb-stat-metrics .sb-metric b { color: var(--amana-mid); }

        /* Layer/legend control stays as the default floating map control (not in the sidebar) */

        /* Push default Leaflet top controls below the navbar */
        .leaflet-top {
            top: calc(var(--topnav-h) + 8px) !important;
        }

        /* Print report content (built dynamically, rendered only inside @media print) */
        .print-header-top {
            display: flex;
            align-items: center;
            gap: 14px;
            border-bottom: 3px solid var(--amana-dark);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }
        .print-logo { height: 48px; width: auto; }
        .print-header-titles { flex: 1; }
        .print-header-titles h1 { margin: 0; font-size: 20px; color: var(--amana-dark2); }
        .print-header-titles span { font-size: 12px; color: var(--amana-gray); }
        .print-header-date { font-size: 12px; color: #3a3a3a; white-space: nowrap; }
        .print-stats-table { width: 100%; border-collapse: collapse; font-size: 11.5px; margin-top: 4px; }
        .print-stats-table th, .print-stats-table td {
            border: 1px solid #cfd8d5;
            padding: 4px 8px;
            text-align: center;
        }
        .print-stats-table thead th { background: var(--amana-bg); color: var(--amana-dark2); font-weight: 700; }
        .print-stats-table tfoot td { font-weight: 800; background: var(--amana-bg); }
        .print-color-dot {
            display: inline-block;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            margin-left: 6px;
            vertical-align: middle;
            border: 1px solid rgba(0,0,0,.15);
        }

        @media print {
            @page { size: A3 landscape; margin: 10mm; }
            html, body { width: auto; height: auto; overflow: visible !important; background: #fff !important; }
            #topnavbar, #rightsidebar, .leaflet-control-container { display: none !important; }
            #printReportHeader {
                display: block !important;
                direction: rtl;
                position: relative;
                width: 100%;
            }
            #map {
                position: relative !important;
                top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important;
                width: 100% !important;
                height: 260mm !important;
                page-break-inside: avoid;
            }
        }

        @media (max-width: 820px) {
            :root { --sidebar-w: 86vw; }
            #topnavbar .navbar-toggle { display: block; }
            #topnavbar .navbar-titles span { display: none; }
            #rightsidebar {
                transform: translateX(100%);
                width: 86vw;
                max-width: 360px;
            }
            #rightsidebar.open { transform: translateX(0); }
            #map { right: 0 !important; }
        }
        </style>

                    '</div>';
            });
            document.getElementById('sidebar-stats').innerHTML = html;

            document.querySelectorAll('#sidebar-stats .sb-stat-row').forEach(function (row) {
                row.addEventListener('click', function () {
                    var key = decodeURIComponent(row.getAttribute('data-status'));
                    activeStatusFilter = (activeStatusFilter === key) ? null : key;
                    applyLineFilter(activeStatusFilter);
                    buildStats();
                });
            });
            var resetEl = document.getElementById('sbStatReset');
            if (resetEl) {
                resetEl.addEventListener('click', function (e) {
                    e.stopPropagation();
                    activeStatusFilter = null;
                    applyLineFilter(null);
                    buildStats();
                });
            }
        }
        buildStats();

        /* ===== Amana UI: collapsible sidebar cards ===== */
        document.querySelectorAll('#rightsidebar .sb-card-header').forEach(function (header) {
            header.addEventListener('click', function () {
                header.closest('.sb-card').classList.toggle('collapsed');
            });
        });

        /* ===== Amana UI: mobile sidebar toggle ===== */
        var sidebarToggleBtn = document.getElementById('sidebarToggleBtn');
        var rightSidebar = document.getElementById('rightsidebar');
        sidebarToggleBtn.addEventListener('click', function () {
            rightSidebar.classList.toggle('open');
        });

        /* ===== Amana UI: A3 print report ===== */
        function buildPrintReport() {
            var statusCounts = {};
            var statusLengths = {};
            var totalCount = 0;
            var totalLength = 0;
            (json__1.features || []).forEach(function (f) {
                var s = (f.properties && f.properties['name']) || 'Unclassified';
                var len = lineLength(f.geometry);
                statusCounts[s] = (statusCounts[s] || 0) + 1;
                statusLengths[s] = (statusLengths[s] || 0) + len;
                totalCount += 1;
                totalLength += len;
            });
            var rows = '';
            Object.keys(statusCounts).sort(function (a, b) {
                return statusOrderIndex(a) - statusOrderIndex(b);
            }).forEach(function (key) {
                var count = statusCounts[key];
                var length = statusLengths[key];
                var pct = totalLength ? Math.round((length / totalLength) * 100) : 0;
                var color = statusColor(key);
                rows += '<tr>' +
                    '<td style="text-align:right;"><span class="print-color-dot" style="background:' + color + ';"></span>' + key + '</td>' +
                    '<td>' + count + '</td>' +
                    '<td>' + fmtArea(length) + '</td>' +
                    '<td>' + pct + '%</td>' +
                    '</tr>';
            });
            var tableHtml = '<table class="print-stats-table">' +
                '<thead><tr><th>الخط</th><th>عدد المقاطع</th><th>الطول (م)</th><th>النسبة</th></tr></thead>' +
                '<tbody>' + rows + '</tbody>' +
                '<tfoot><tr><td>الإجمالي</td><td>' + totalCount + '</td><td>' + fmtArea(totalLength) + '</td><td>100%</td></tr></tfoot>' +
                '</table>';
            document.getElementById('printStatsTable').innerHTML = tableHtml;
            var dateEl = document.getElementById('printDate');
            if (dateEl) {
                dateEl.textContent = new Date().toLocaleDateString('ar-SA', { year: 'numeric', month: 'long', day: 'numeric' });
            }
        }
        var printReportBtn = document.getElementById('printReportBtn');
        printReportBtn.addEventListener('click', function () {
            buildPrintReport();
            map.invalidateSize();
            setTimeout(function () {
                window.print();
            }, 200);
        });
        window.addEventListener('beforeprint', buildPrintReport);
        </script>        
    </body>
</html>
